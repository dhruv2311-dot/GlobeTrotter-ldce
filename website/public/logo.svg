<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="planeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#globeGradient)" filter="url(#shadow)"/>
  
  <!-- Globe Grid Lines -->
  <g stroke="#60A5FA" stroke-width="1.5" fill="none" opacity="0.6">
    <!-- Longitude lines -->
    <ellipse cx="100" cy="100" rx="30" ry="85"/>
    <ellipse cx="100" cy="100" rx="60" ry="85"/>
    <ellipse cx="100" cy="100" rx="85" ry="85"/>
    
    <!-- Latitude lines -->
    <ellipse cx="100" cy="100" rx="85" ry="30"/>
    <ellipse cx="100" cy="100" rx="85" ry="60"/>
    <line x1="15" y1="100" x2="185" y2="100"/>
  </g>
  
  <!-- Continents (stylized) -->
  <g fill="#10B981" opacity="0.8">
    <!-- North America -->
    <path d="M45 55 Q55 45 65 50 Q70 60 65 70 Q55 75 45 65 Q40 60 45 55"/>
    
    <!-- South America -->
    <path d="M55 85 Q65 80 70 90 Q75 110 65 130 Q55 135 50 120 Q45 100 55 85"/>
    
    <!-- Europe -->
    <path d="M95 45 Q105 40 115 45 Q120 55 115 60 Q105 65 95 60 Q90 55 95 45"/>
    
    <!-- Africa -->
    <path d="M95 70 Q110 65 120 80 Q125 110 115 130 Q100 140 90 120 Q85 90 95 70"/>
    
    <!-- Asia -->
    <path d="M125 50 Q145 45 160 55 Q165 75 155 85 Q140 90 125 80 Q115 65 125 50"/>
    
    <!-- Australia -->
    <path d="M140 110 Q155 105 165 115 Q170 130 160 140 Q145 145 135 130 Q130 120 140 110"/>
  </g>
  
  <!-- Airplane -->
  <g transform="translate(100, 100) rotate(-45)">
    <path d="M-15 0 L-5 -3 L5 -8 L15 -5 L5 0 L15 5 L5 8 L-5 3 L-15 0" 
          fill="url(#planeGradient)" 
          filter="url(#shadow)"
          transform="translate(25, -25)"/>
  </g>
  
  <!-- Flight Path -->
  <path d="M60 140 Q100 100 140 60" 
        stroke="#F59E0B" 
        stroke-width="3" 
        fill="none" 
        stroke-dasharray="8,4"
        opacity="0.9"/>
  
  <!-- Location Markers -->
  <g fill="#EF4444">
    <circle cx="60" cy="140" r="5"/>
    <circle cx="140" cy="60" r="5"/>
  </g>
  
  <!-- Stars/Sparkles -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="30" cy="40" r="2"/>
    <circle cx="170" cy="45" r="2"/>
    <circle cx="25" cy="100" r="1.5"/>
    <circle cx="175" cy="100" r="1.5"/>
    <circle cx="35" cy="160" r="2"/>
    <circle cx="165" cy="155" r="2"/>
  </g>
  
  <!-- Text "GT" -->
  <text x="100" y="175" 
        text-anchor="middle" 
        font-family="Arial, sans-serif" 
        font-size="24" 
        font-weight="bold" 
        fill="#FFFFFF"
        filter="url(#shadow)">GT</text>
</svg>
