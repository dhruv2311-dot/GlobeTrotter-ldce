<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tripGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="suitcaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing background aura -->
  <circle cx="250" cy="200" r="140" fill="#06B6D4" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="250" cy="200" r="90" fill="#8B5CF6" opacity="0.1" filter="url(#softGlow)"/>

  <!-- Compass / World Map Ring background -->
  <circle cx="250" cy="200" r="160" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="250" cy="200" r="120" fill="none" stroke="rgba(6, 182, 212, 0.15)" stroke-width="1.5"/>

  <!-- Flight curve -->
  <path d="M 100 280 C 180 120, 320 100, 400 180" fill="none" stroke="url(#tripGrad)" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>

  <!-- Suitcase -->
  <g transform="translate(180, 140)">
    <!-- Handle -->
    <rect x="50" y="0" width="40" height="30" rx="8" fill="none" stroke="#06B6D4" stroke-width="5"/>
    <!-- Body -->
    <rect x="10" y="25" width="120" height="140" rx="20" fill="url(#suitcaseGrad)" stroke="#38BDF8" stroke-width="3"/>
    <!-- Straps -->
    <line x1="45" y1="25" x2="45" y2="165" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
    <line x1="95" y1="25" x2="95" y2="165" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
    <!-- Corners -->
    <rect x="10" y="25" width="25" height="25" rx="6" fill="#06B6D4" opacity="0.4"/>
    <rect x="105" y="25" width="25" height="25" rx="6" fill="#06B6D4" opacity="0.4"/>
    <rect x="10" y="140" width="25" height="25" rx="6" fill="#06B6D4" opacity="0.4"/>
    <rect x="105" y="140" width="25" height="25" rx="6" fill="#06B6D4" opacity="0.4"/>
    <!-- Tag -->
    <circle cx="70" cy="95" r="16" fill="url(#goldGrad)"/>
    <path d="M 64 95 L 76 95 M 70 89 L 70 101" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating Ticket / Passport -->
  <g transform="translate(300, 180) rotate(15)">
    <rect x="0" y="0" width="90" height="120" rx="12" fill="#0F172A" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="45" cy="45" r="20" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <path d="M 20 85 L 70 85 M 20 95 L 55 95" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Airplane Icon Floating -->
  <g transform="translate(390, 175) rotate(35)">
    <path d="M 0 -18 L 15 18 L 0 10 L -15 18 Z" fill="#06B6D4"/>
  </g>

  <!-- Sparkles -->
  <circle cx="130" cy="140" r="4" fill="#F59E0B"/>
  <circle cx="370" cy="110" r="5" fill="#38BDF8"/>
  <circle cx="120" cy="240" r="3" fill="#8B5CF6"/>
</svg>
