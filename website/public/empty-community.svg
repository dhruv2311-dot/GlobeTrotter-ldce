<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="commGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glowComm">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="250" cy="200" r="140" fill="#10B981" opacity="0.08" filter="url(#glowComm)"/>

  <!-- Network connection lines -->
  <path d="M 120 180 Q 250 100 380 180 T 250 300 Z" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Central Globe Node -->
  <circle cx="250" cy="200" r="65" fill="#0F172A" stroke="url(#commGrad)" stroke-width="3"/>
  <ellipse cx="250" cy="200" rx="30" ry="65" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
  <ellipse cx="250" cy="200" rx="65" ry="25" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>

  <!-- User Avatars / Nodes Floating around -->
  <!-- Node 1 -->
  <g transform="translate(110, 140)">
    <circle cx="24" cy="24" r="24" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <circle cx="24" cy="18" r="8" fill="#10B981"/>
    <path d="M 10 36 C 10 28 38 28 38 36 Z" fill="#10B981"/>
  </g>

  <!-- Node 2 -->
  <g transform="translate(340, 130)">
    <circle cx="24" cy="24" r="24" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="24" cy="18" r="8" fill="#38BDF8"/>
    <path d="M 10 36 C 10 28 38 28 38 36 Z" fill="#38BDF8"/>
  </g>

  <!-- Node 3 -->
  <g transform="translate(226, 280)">
    <circle cx="24" cy="24" r="24" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="24" cy="18" r="8" fill="#F59E0B"/>
    <path d="M 10 36 C 10 28 38 28 38 36 Z" fill="#F59E0B"/>
  </g>

  <!-- Chat / Share Bubbles -->
  <g transform="translate(290, 80) rotate(10)">
    <rect x="0" y="0" width="70" height="45" rx="12" fill="#8B5CF6"/>
    <path d="M 20 45 L 15 55 L 30 45 Z" fill="#8B5CF6"/>
    <circle cx="22" cy="22" r="4" fill="#FFFFFF"/>
    <circle cx="35" cy="22" r="4" fill="#FFFFFF"/>
    <circle cx="48" cy="22" r="4" fill="#FFFFFF"/>
  </g>
</svg>
