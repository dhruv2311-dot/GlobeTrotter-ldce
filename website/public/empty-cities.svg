<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glowCity">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing background aura -->
  <circle cx="250" cy="200" r="130" fill="#38BDF8" opacity="0.08" filter="url(#glowCity)"/>

  <!-- Compass Ring -->
  <circle cx="250" cy="200" r="150" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="250" cy="200" r="110" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- City Skyline Silhouette -->
  <g transform="translate(100, 160)">
    <!-- Building 1 -->
    <rect x="20" y="70" width="45" height="110" rx="4" fill="url(#buildingGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <circle cx="42" cy="90" r="3" fill="#F59E0B"/>
    <circle cx="42" cy="110" r="3" fill="#F59E0B"/>

    <!-- Building 2 (Tower) -->
    <rect x="75" y="20" width="50" height="160" rx="6" fill="url(#buildingGrad)" stroke="#38BDF8" stroke-width="2"/>
    <line x1="100" y1="0" x2="100" y2="20" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="100" cy="0" r="4" fill="#F43F5E" filter="url(#glowCity)"/>
    <!-- Windows -->
    <rect x="88" y="40" width="8" height="12" rx="2" fill="#38BDF8" opacity="0.8"/>
    <rect x="104" y="40" width="8" height="12" rx="2" fill="#38BDF8" opacity="0.8"/>
    <rect x="88" y="65" width="8" height="12" rx="2" fill="#F59E0B" opacity="0.8"/>
    <rect x="104" y="65" width="8" height="12" rx="2" fill="#38BDF8" opacity="0.8"/>

    <!-- Building 3 (Dome/Modern) -->
    <path d="M 135 180 L 135 90 A 25 25 0 0 1 185 90 L 185 180 Z" fill="url(#buildingGrad)" stroke="rgba(139, 92, 246, 0.5)" stroke-width="2"/>

    <!-- Building 4 -->
    <rect x="195" y="50" width="55" height="130" rx="6" fill="url(#buildingGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <rect x="210" y="80" width="25" height="6" rx="2" fill="#8B5CF6"/>
    <rect x="210" y="100" width="25" height="6" rx="2" fill="#38BDF8"/>
    <rect x="210" y="120" width="25" height="6" rx="2" fill="#F59E0B"/>
  </g>

  <!-- Big Pin Marker -->
  <g transform="translate(225, 80)">
    <path d="M 25 0 C 11 0 0 11 0 25 C 0 42 25 70 25 70 C 25 70 50 42 50 25 C 50 11 39 0 25 0 Z" fill="url(#cityGrad)" filter="url(#glowCity)"/>
    <circle cx="25" cy="24" r="10" fill="#FFFFFF"/>
  </g>

  <!-- Search Magnifier Overlay -->
  <g transform="translate(310, 210) rotate(-15)">
    <circle cx="35" cy="35" r="28" fill="none" stroke="#F59E0B" stroke-width="5"/>
    <line x1="56" y1="56" x2="80" y2="80" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
